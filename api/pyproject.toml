[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: pruebas que requieren las bases de datos reales (RUN_DB_INTEGRATION=1)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
